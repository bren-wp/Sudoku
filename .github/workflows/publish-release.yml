name: Publish Sudoku release

# Privileged workflow_run NEVER checks out or executes untrusted PR code.
# Only publish the latest main SHA after BOTH full CI suites pass for that SHA.
on:
  workflow_run:
    workflows: ["Android CI", "Android visual smoke"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two workflow_run completions must not publish the same version concurrently.
  group: sudoku-publish-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout trusted main for release gate
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate trigger and exact-SHA upstream quality gates
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$DISPATCH_REF" == "refs/heads/main" ]] || {
              echo "::notice::Manual publish must run from main"; exit 0;
            }
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$TRIGGER_REPO" == "$REPO" && "$TRIGGER_EVENT" == "push" ]] || {
              echo "::notice::Ignoring non-main / untrusted upstream workflow"; exit 0;
            }
          else
            echo "::error::Unexpected release trigger" >&2
            exit 1
          fi
          main_sha="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          [[ "$main_sha" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$(git rev-parse HEAD)" != "$main_sha" ]]; then
            echo "::notice::main advanced during gate checkout; retry after the new CI run"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_run" && "$TRIGGER_SHA" != "$main_sha" ]]; then
            echo "::notice::Ignoring an upstream run for an older main SHA"
            exit 0
          fi
          if bash scripts/test_release_ci_gates.sh &&
             bash scripts/require-release-ci-gates.sh "$REPO" "$main_sha"; then
            echo "sha=$main_sha" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release withheld until all required checks pass"
          fi
  publish:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    # Configure required reviewers and publisher secrets for this environment
    # under GitHub Settings -> Environments; it must not allow untrusted PRs.
    environment: sudoku-release
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Pin the existing Google Play UPLOAD certificate, not a generated key.
      SUDOKU_EXPECTED_CERT_SHA256: ${{ vars.SUDOKU_EXPECTED_CERT_SHA256 }}
    steps:
      - name: Checkout merged, trusted source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Version and release check
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && (( VERSION_CODE > 0 ))
          echo "Android release v$VERSION (versionCode $VERSION_CODE)"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # An older job or a later GitHub metadata edit can leave an unsigned
      # test bundle labelled as a stable release. Reconcile from the actual
      # uploaded artifact names every time this workflow visits that tag.
      - name: Reconcile existing unsigned release classification
        if: steps.version.outputs.exists == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh api "repos/$REPO/releases/tags/$RELEASE_TAG" --jq '.assets[].name')"
          if grep -Fq -- "-unsigned.aab" <<< "$assets"; then
            id="$(gh api "repos/$REPO/releases/tags/$RELEASE_TAG" --jq '.id')"
            gh api --method PATCH "repos/$REPO/releases/$id" -F prerelease=true --silent
            classification="$(gh api "repos/$REPO/releases/tags/$RELEASE_TAG" --jq '.prerelease')"
            [[ "$classification" == "true" ]] ||
              { echo "::error::Unsigned release was not classified as prerelease"; exit 1; }
          fi
      - name: Extract real release notes from CHANGELOG.md
        if: steps.version.outputs.exists != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            /^## / {
              if (found) exit
              if ($0 == "## " version || index($0, "## " version " ") == 1) {
                found=1
                print
                next
              }
            }
            found { print }
          ' CHANGELOG.md > release-changelog.md
          test -s release-changelog.md || {
            echo "::error::CHANGELOG.md has no entry for $RELEASE_TAG"
            exit 1
          }
      - name: Configure optional publisher signing
        if: steps.version.outputs.exists != 'true'
        shell: bash
        env:
          SUDOKU_KEYSTORE_BASE64: ${{ secrets.SUDOKU_KEYSTORE_BASE64 }}
          SUDOKU_SIGNING_KEY_ALIAS: ${{ secrets.SUDOKU_SIGNING_KEY_ALIAS }}
          SUDOKU_SIGNING_STORE_PASSWORD: ${{ secrets.SUDOKU_SIGNING_STORE_PASSWORD }}
          SUDOKU_SIGNING_KEY_PASSWORD: ${{ secrets.SUDOKU_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SUDOKU_KEYSTORE_BASE64" && -n "$SUDOKU_SIGNING_KEY_ALIAS" &&
                -n "$SUDOKU_SIGNING_STORE_PASSWORD" && -n "$SUDOKU_SIGNING_KEY_PASSWORD" ]]; then
            if [[ -z "${SUDOKU_EXPECTED_CERT_SHA256:-}" ]]; then
              echo "::error::Publisher signing needs a pinned SUDOKU_EXPECTED_CERT_SHA256 environment variable" >&2
              exit 1
            fi
            printf '%s' "$SUDOKU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sudoku-publisher.jks"
            echo "SUDOKU_SIGNING_STORE_FILE=$RUNNER_TEMP/sudoku-publisher.jks" >> "$GITHUB_ENV"
            echo "SUDOKU_SIGNING_KEY_ALIAS=$SUDOKU_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SUDOKU_SIGNING_STORE_PASSWORD=$SUDOKU_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SUDOKU_SIGNING_KEY_PASSWORD=$SUDOKU_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "PUBLISHER_SIGNED=true" >> "$GITHUB_ENV"
          else
            if [[ -n "$SUDOKU_KEYSTORE_BASE64" || -n "$SUDOKU_SIGNING_KEY_ALIAS" ||
                  -n "$SUDOKU_SIGNING_STORE_PASSWORD" || -n "$SUDOKU_SIGNING_KEY_PASSWORD" ]]; then
              echo "::error::Partial publisher signing configuration; refusing unverified downgrade" >&2
              exit 1
            fi
            echo "PUBLISHER_SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Test, lint and build Android release from merge commit
        if: steps.version.outputs.exists != 'true'
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:lintRelease \
            :app:assembleDebug :app:assembleRelease :app:bundleRelease
      # A release must never bypass the fresh vulnerability gate just because
      # the PR job passed: verify the same merged source and resolved versions.
      - name: Build merged-source SBOM and scan every release dependency in OSV
        if: steps.version.outputs.exists != 'true'
        shell: bash
        run: |
          gradle --no-daemon :app:cyclonedxDirectBom
          python3 scripts/osv_release_scan.py \
            --sbom app/build/reports/cyclonedx-direct/bom.json \
            --report app/build/reports/security/osv-release-report.json \
            --csv app/build/reports/security/osv-release-components.csv \
            --fail-on-findings
      - name: Recheck main has not advanced before publishing
        if: steps.version.outputs.exists != 'true'
        shell: bash
        env:
          RELEASE_SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          live_sha="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          [[ "$live_sha" == "$RELEASE_SOURCE_SHA" && "$(git rev-parse HEAD)" == "$RELEASE_SOURCE_SHA" ]] || {
            echo "::error::main advanced since CI gates passed; refuse release" >&2
            exit 1
          }
      - name: Publish APK and AAB (signed only when publisher key is configured)
        if: steps.version.outputs.exists != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "$PUBLISHER_SIGNED" == 'true' ]]; then
            APK="$(find app/build/outputs/apk/release -type f -name '*release.apk' | head -n 1)"
            AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
            test -s "$APK" && test -s "$AAB"
            bash scripts/verify-publisher-certificate.sh "$APK" "$AAB" "$SUDOKU_EXPECTED_CERT_SHA256"
            cp "$APK" "release-assets/Sudoku-$RELEASE_TAG.apk"
            cp "$AAB" "release-assets/Sudoku-$RELEASE_TAG.aab"
            (cd release-assets && sha256sum Sudoku-*.apk Sudoku-*.aab > SHA256SUMS)
            printf '%s\n' "Sudoku $RELEASE_TAG • by Brendigo" "" \
              "Potpisani Android APK i AAB izrađeni su iz testiranog merge commita." \
              "SHA256SUMS sadrži kontrolne SHA-256 sažetke oba artefakta." \
              "Prije objave na Google Playu provjerite certifikat i provedite završnu provjeru aplikacije." \
              > release-notes.md
            printf '\n' >> release-notes.md
            cat release-changelog.md >> release-notes.md
            gh release create "$RELEASE_TAG" release-assets/* -R "$REPO" \
              --target "$SOURCE_SHA" --title "Sudoku $RELEASE_TAG" \
              --notes-file release-notes.md
          else
            APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
            AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
            test -s "$APK" && test -s "$AAB"
            cp "$APK" "release-assets/Sudoku-$RELEASE_TAG-test.apk"
            cp "$AAB" "release-assets/Sudoku-$RELEASE_TAG-unsigned.aab"
            (cd release-assets && sha256sum Sudoku-*.apk Sudoku-*.aab > SHA256SUMS)
            printf '%s\n' "Sudoku $RELEASE_TAG • by Brendigo" "" \
              "**TESTNO IZDANJE**: APK je debug potpisan; AAB je nepotpisan." \
              "SHA256SUMS sadrži kontrolne SHA-256 sažetke oba artefakta." \
              "**Nije spremno za Google Play.** Za izdavački potpis potrebne su " \
              "SUDOKU_KEYSTORE_BASE64, SUDOKU_SIGNING_KEY_ALIAS, " \
              "SUDOKU_SIGNING_STORE_PASSWORD i SUDOKU_SIGNING_KEY_PASSWORD." \
              > release-notes.md
            printf '\n' >> release-notes.md
            cat release-changelog.md >> release-notes.md
            gh release create "$RELEASE_TAG" release-assets/* -R "$REPO" \
              --target "$SOURCE_SHA" --title "Sudoku $RELEASE_TAG" \
              --notes-file release-notes.md --prerelease
            # Defensive reconciliation: test artifacts must never be labelled
            # a stable Google Play-ready GitHub release.
            gh release edit "$RELEASE_TAG" -R "$REPO" --prerelease
          fi
      - name: Verify published APK/AAB, SHA-256 and signing
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.version.outputs.exists }}
        run: |
          set -euo pipefail
          # A previously published tag may intentionally point to an older
          # app commit if only workflow or documentation files changed.
          expected_sha=""
          if [[ "$RELEASE_EXISTS" != 'true' ]]; then
            expected_sha="$(git rev-parse HEAD)"
          fi
          bash scripts/verify-release-assets.sh "$RELEASE_TAG" "$REPO" \
            "${PUBLISHER_SIGNED:-auto}" "$expected_sha"
