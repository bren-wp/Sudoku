name: Android CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Static analysis
        run: gradle --no-daemon :app:lintDebug
      - name: Build debug APK and release bundle
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-unsigned-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
