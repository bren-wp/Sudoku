name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Release artifact contract regression tests
        shell: bash
        run: |
          bash -n scripts/verify-release-assets.sh
          bash -n scripts/test_verify_release_assets.sh
          bash scripts/test_verify_release_assets.sh
          bash -n scripts/reconcile-release-classification.sh
          bash -n scripts/test_release_classification.sh
          bash scripts/test_release_classification.sh
          bash -n .github/scripts/run-release-runtime-smoke.sh
          python3 -m unittest discover -s scripts -p 'test_release_runtime_smoke.py' -v
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Pixel QA metric regression tests
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/sudoku-pixel-qa"
          source "$RUNNER_TEMP/sudoku-pixel-qa/bin/activate"
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          python -m unittest discover -s scripts -p 'test_pixel_compare.py' -v
      - name: Static analysis
        run: gradle --no-daemon :app:lintDebug
      - name: Configure optional publisher signature
        shell: bash
        env:
          SUDOKU_KEYSTORE_BASE64: ${{ secrets.SUDOKU_KEYSTORE_BASE64 }}
          SUDOKU_SIGNING_KEY_ALIAS: ${{ secrets.SUDOKU_SIGNING_KEY_ALIAS }}
          SUDOKU_SIGNING_STORE_PASSWORD: ${{ secrets.SUDOKU_SIGNING_STORE_PASSWORD }}
          SUDOKU_SIGNING_KEY_PASSWORD: ${{ secrets.SUDOKU_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$SUDOKU_KEYSTORE_BASE64" && -n "$SUDOKU_SIGNING_KEY_ALIAS" && -n "$SUDOKU_SIGNING_STORE_PASSWORD" && -n "$SUDOKU_SIGNING_KEY_PASSWORD" ]]; then
            printf "%s" "$SUDOKU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sudoku-publisher.jks"
            echo "SUDOKU_SIGNING_STORE_FILE=$RUNNER_TEMP/sudoku-publisher.jks" >> "$GITHUB_ENV"
            echo "SUDOKU_SIGNING_KEY_ALIAS=$SUDOKU_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SUDOKU_SIGNING_STORE_PASSWORD=$SUDOKU_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SUDOKU_SIGNING_KEY_PASSWORD=$SUDOKU_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SUDOKU_HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "SUDOKU_HAS_SIGNING=false" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK, release APK and AAB
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Release-only CycloneDX dependency inventory
        run: gradle --no-daemon :app:cyclonedxDirectBom
      - name: Verify compiled release permissions, R8 and dependency inventory
        shell: bash
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_audit.py' -v
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1
          python3 scripts/audit_android_release.py \
            --apk "${apks[0]}" \
            --mapping-dir app/build/outputs/mapping/release \
            --sbom app/build/reports/cyclonedx-direct/bom.json \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            --report app/build/reports/security/release-audit.json
      - name: Analyze concrete R8 removed classes and members
        shell: bash
        run: |
          python3 -m unittest discover -s scripts -p 'test_extended_security_audit.py' -v
          python3 scripts/analyze_r8_usage.py \
            --mapping-dir app/build/outputs/mapping/release \
            --json app/build/reports/security/r8-removed-symbols.json \
            --app-symbols app/build/reports/security/r8-unused-app-symbols.txt
      - name: OSV scan of ALL release Maven components
        shell: bash
        run: |
          python3 scripts/osv_release_scan.py \
            --sbom app/build/reports/cyclonedx-direct/bom.json \
            --report app/build/reports/security/osv-release-report.json \
            --csv app/build/reports/security/osv-release-components.csv
      - name: Upload release security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-release-sbom-r8-osv-audit
          path: |
            app/build/reports/cyclonedx-direct/bom.json
            app/build/reports/security/
          if-no-files-found: warn
      - name: Block release when OSV finds a known vulnerable dependency
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("app/build/reports/security/osv-release-report.json").read_text())
          assert report["component_count"] == report["queried_component_count"] and report["positive_control_verified"]
          findings = report["components_with_matches"]
          if findings:
              raise SystemExit(f"OSV: {findings} release dependencies have known advisories; review the uploaded report")
          print(f"OSV: {report['component_count']} exact Maven versions scanned; no matching OSV advisories at scan time")
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload signed APK
        if: env.SUDOKU_HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-signed-release-apk
          path: app/build/outputs/apk/release/*-release.apk
          if-no-files-found: error
      - name: Upload signed AAB
        if: env.SUDOKU_HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-signed-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload unsigned release AAB
        if: env.SUDOKU_HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-unsigned-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
