name: Refresh Sudoku marketing screenshots

# This development branch workflow captures ACTUAL Compose screens, not concept art.
# It writes only small WebP screenshots on the dedicated development branch.
on:
  push:
    branches: ["feature/sudoku-v138-visual-parity-pass"]
    paths:
      - ".github/workflows/marketing-screenshots.yml"
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: sudoku-marketing-captures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    if: github.repository == 'bren-wp/Sudoku'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Capture eight actual Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
          script: |
            adb shell wm size 941x1672
            adb shell wm density 320
            bash .github/scripts/run-visual-smoke.sh
      - name: Generate full-resolution real Android WebP gallery
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("screenshots")
          destination = Path("docs/screenshots")
          destination.mkdir(parents=True, exist_ok=True)
          expected = [
              "01-home", "02-new-game", "03-game", "04-settings",
              "05-daily", "06-statistics", "07-achievements", "08-splash",
          ]
          for basename in expected:
              filename = source / (basename + ".png")
              if not filename.is_file():
                  raise SystemExit(f"Missing actual emulator capture: {filename}")
              with Image.open(filename) as image:
                  if image.size != (941, 1672):
                      raise SystemExit(f"Unexpected emulator size for {filename}: {image.size}")
                  output = destination / (basename + ".webp")
                  # Full native capture resolution, compressed for GitHub README.
                  image.convert("RGB").save(
                      output, format="WEBP", quality=85, method=6,
                  )
                  print(output, output.stat().st_size)
          PY
      - name: Publish verified captures to development branch
        # Never write to main on workflow_dispatch; releases require reviewed PRs.
        if: github.ref == 'refs/heads/feature/sudoku-v138-visual-parity-pass'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.webp
          if git diff --cached --quiet; then
            echo "Marketing screenshots unchanged"
            exit 0
          fi
          git commit -m "docs(marketing): add real Android UI screenshot gallery [skip ci]"
          git pull --rebase origin feature/sudoku-v138-visual-parity-pass
          git push origin HEAD:feature/sudoku-v138-visual-parity-pass
