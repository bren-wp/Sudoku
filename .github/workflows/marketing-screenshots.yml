name: Refresh Sudoku marketing screenshots

# Capture real Compose screens for every Sudoku feature branch. A manual run on
# main is read-only: only dedicated feature branches may publish captured assets.
on:
  push:
    branches:
      - "feature/sudoku-*"
    paths:
      - ".github/workflows/marketing-screenshots.yml"
      - ".github/scripts/run-visual-smoke.sh"
      - ".github/scripts/export-emulator-screenshots.sh"
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: sudoku-marketing-captures-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    if: github.repository == 'bren-wp/Sudoku'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Capture eight actual Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
          script: |
            adb shell wm size 941x1672
            adb shell wm density 320
            bash .github/scripts/run-visual-smoke.sh
      - name: Generate full-resolution real Android WebP gallery
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("screenshots")
          destination = Path("docs/screenshots")
          destination.mkdir(parents=True, exist_ok=True)
          expected = [
              "01-home", "02-new-game", "03-game", "04-settings",
              "05-daily", "06-statistics", "07-achievements", "08-splash",
          ]
          for basename in expected:
              filename = source / (basename + ".png")
              if not filename.is_file():
                  raise SystemExit(f"Missing actual emulator capture: {filename}")
              with Image.open(filename) as image:
                  if image.size != (941, 1672):
                      raise SystemExit(f"Unexpected emulator size for {filename}: {image.size}")
                  output = destination / (basename + ".webp")
                  image.convert("RGB").save(
                      output, format="WEBP", quality=85, method=6,
                  )
                  print(output, output.stat().st_size)
          PY
      - name: Upload actual screen captures for pixel QA
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-real-android-captures
          path: screenshots/*.png
          if-no-files-found: error
      - name: Upload preview gallery
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-real-webp-gallery
          path: docs/screenshots/*.webp
          if-no-files-found: error
      - name: Publish verified captures only on Sudoku feature branches
        if: startsWith(github.ref, 'refs/heads/feature/sudoku-')
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          [[ "$BRANCH" =~ ^feature/sudoku-[A-Za-z0-9._/-]+$ ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.webp
          if git diff --cached --quiet; then
            echo "Marketing screenshots unchanged"
            exit 0
          fi
          git commit -m "docs(marketing): refresh actual Android screenshots [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
