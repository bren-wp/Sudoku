name: Android visual smoke

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/scripts/run-visual-smoke.sh"
      - ".github/scripts/export-emulator-screenshots.sh"
      - ".github/workflows/visual-smoke.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "docs/screenshots/**"
      - ".github/scripts/export-emulator-screenshots.sh"
      - ".github/scripts/run-visual-smoke.sh"
      - ".github/workflows/visual-smoke.yml"
  workflow_dispatch:

concurrency:
  group: emulator-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Android UI (${{ matrix.layout }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Avoid overwhelming hosted emulator runners and SDK package downloads.
      max-parallel: 3
      matrix:
        include:
          - layout: reference
            resolution: 941x1672
            density: 320
            # The full 41-test flow exhausted the reference emulator's
            # graphics buffers and disconnected adb after ~14 cases.
            # Capture the actual 941x1672 PNGs in a fresh bounded session.
            # Full-suite coverage remains in the other lanes and tablet shards.
            visual_args: "--reference-capture"
            artifact: sudoku-emulator-screen-references
          - layout: compact
            resolution: 720x1280
            density: 320
            visual_args: "--splash-home-only"
            artifact: sudoku-emulator-compact-screenshots
          # The extra devices check constrained layout, landscape and wide
          # tablets. Reference pixel MAE is measured ONLY on 941x1672.
          - layout: narrow
            resolution: 540x1080
            density: 320
            visual_args: "--splash-home-only"
            artifact: sudoku-emulator-narrow-screenshots
          - layout: landscape
            resolution: 1280x720
            density: 320
            visual_args: "--splash-home-only"
            artifact: sudoku-emulator-landscape-screenshots
          # The complete 41-test suite on this high-resolution emulator
          # died after ~16 cases with adb offline / ColorBuffer failures.
          # Four independent 0-based shards preserve *all* tests while
          # restarting the AVD for each bounded group. The capture job
          # separately exports the full set of native screenshots.
          - layout: tablet-shard-0
            resolution: 1200x1920
            density: 240
            # SwANGLE with Vulkan disabled passed all 4 tablet shards.
            # Match the stable backend across every emulator profile.
            gpu_mode: swangle
            emulator_gpu_flags: "-feature -Vulkan"
            visual_args: "--tablet-shard 0 4"
            artifact: sudoku-tablet-shard-0
          - layout: tablet-shard-1
            resolution: 1200x1920
            density: 240
            # Use the same proven software graphics backend in each lane.
            gpu_mode: swangle
            emulator_gpu_flags: "-feature -Vulkan"
            visual_args: "--tablet-shard 1 4"
            artifact: sudoku-tablet-shard-1
          - layout: tablet-shard-2
            resolution: 1200x1920
            density: 240
            # Use the same proven software graphics backend in each lane.
            gpu_mode: swangle
            emulator_gpu_flags: "-feature -Vulkan"
            visual_args: "--tablet-shard 2 4"
            artifact: sudoku-tablet-shard-2
          - layout: tablet-shard-3
            resolution: 1200x1920
            density: 240
            # Use the same proven software graphics backend in each lane.
            gpu_mode: swangle
            emulator_gpu_flags: "-feature -Vulkan"
            visual_args: "--tablet-shard 3 4"
            artifact: sudoku-tablet-shard-3
          - layout: tablet-capture
            resolution: 1200x1920
            density: 240
            # Use the same proven software graphics backend in each lane.
            gpu_mode: swangle
            emulator_gpu_flags: "-feature -Vulkan"
            visual_args: "--tablet-capture"
            artifact: sudoku-emulator-tablet-screenshots
          # Boundary checks for 240dp and 400dp content layouts. These
          # profiles run focused Splash/Home/New Game tests; tablet shards
          # collectively execute all instrumentation tests.
          - layout: tiny
            resolution: 480x800
            density: 320
            visual_args: "--splash-home-only"
            artifact: sudoku-emulator-tiny-splash-home
          - layout: medium
            resolution: 800x1440
            density: 320
            visual_args: "--splash-home-only"
            artifact: sudoku-emulator-medium-splash-home
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Enable KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      # Both emulator AND Android 35 x86_64 system image can arrive as
      # corrupt ZIPs on GitHub-hosted runners. The emulator-runner itself
      # installs each once, so provision both beforehand with bounded retries.
      # Never retry or suppress real app/instrumentation test failures.
      - name: Provision emulator and Android 35 system image with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          provision_sdk_package() {
            local package="$1" expected="$2" label="$3" partial_dir="${4:-}"
            local attempt
            for attempt in 1 2 3; do
              echo "$label SDK installation attempt $attempt/3"
              if "$SDKMANAGER" --install "$package" --channel=0 &&
                  test -s "$expected"; then
                echo "$label SDK package successfully provisioned"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                # Only remove incomplete runner SDK downloads/package contents,
                # never source files, AVD state or actual app test results.
                rm -rf "$ANDROID_HOME/.temp"
                if [ -n "$partial_dir" ]; then
                  case "$partial_dir" in
                    "$ANDROID_HOME/system-images/android-35/default/x86_64") rm -rf "$partial_dir" ;;
                    *) echo "::error::Unsafe SDK cleanup target"; return 1 ;;
                  esac
                fi
                sleep $((attempt * 4))
              fi
            done
            echo "::error::$label SDK package failed to install after 3 attempts"
            return 1
          }
          provision_sdk_package "emulator" "$ANDROID_HOME/emulator/emulator" "Emulator"
          provision_sdk_package "system-images;android-35;default;x86_64" \
            "$ANDROID_HOME/system-images/android-35/default/x86_64/system.img" \
            "Android 35 x86_64 system image" \
            "$ANDROID_HOME/system-images/android-35/default/x86_64"
      - name: Run Android UI flow and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: "-no-window -gpu ${{ matrix.gpu_mode || 'swangle' }} -no-snapshot -noaudio -no-boot-anim -feature -Vulkan"
          script: |
            # Seven viewport sizes: four tablet shards cover the full suite;
            # other profiles run a short, deterministic responsive UI flow:
            # 270dp narrow, 640x360dp landscape, 800dp tablet, 240dp tiny and 400dp medium.
            # Only reference screenshots are compared to the owner's 941x1672 art.
            adb shell wm size ${{ matrix.resolution }}
            # Keep density stable to reveal layout overflow and touch targets.
            adb shell wm density ${{ matrix.density }}
            adb shell wm size
            adb shell wm density
            bash .github/scripts/run-visual-smoke.sh ${{ matrix.visual_args }}
      - name: Upload instrumentation failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-test-failure-${{ matrix.layout }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
      - name: Upload actual Android screenshots
        if: always() && !startsWith(matrix.layout, 'tablet-shard')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: screenshots/*.png
          if-no-files-found: warn
