name: Android visual smoke

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/visual-smoke.yml"
  workflow_dispatch:

concurrency:
  group: emulator-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Run Android UI flow and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
          script: |
            # Reference artworks were supplied at 941x1672 pixels.
            # Set exact device pixel bounds before the screenshot baseline.
            adb shell wm size 941x1672
            adb shell wm density 420
            bash .github/scripts/run-visual-smoke.sh
      - name: Upload actual Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-emulator-screen-references
          path: screenshots/*.png
          if-no-files-found: warn
