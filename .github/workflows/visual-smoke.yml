name: Android visual smoke

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/visual-smoke.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "docs/screenshots/**"
      - ".github/scripts/export-emulator-screenshots.sh"
      - ".github/workflows/visual-smoke.yml"
  workflow_dispatch:

concurrency:
  group: emulator-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Android UI (${{ matrix.layout }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: reference
            resolution: 941x1672
            density: 320
            artifact: sudoku-emulator-screen-references
          - layout: compact
            resolution: 720x1280
            density: 320
            artifact: sudoku-emulator-compact-screenshots
          # The extra devices check constrained layout, landscape and wide
          # tablets. Reference pixel MAE is measured ONLY on 941x1672.
          - layout: narrow
            resolution: 540x1080
            density: 320
            artifact: sudoku-emulator-narrow-screenshots
          - layout: landscape
            resolution: 1280x720
            density: 320
            artifact: sudoku-emulator-landscape-screenshots
          - layout: tablet
            resolution: 1200x1920
            density: 240
            artifact: sudoku-emulator-tablet-screenshots
          # Boundary checks for 240dp and 400dp content layouts. These
          # profiles run only Splash/Home tests; the five above run the
          # full instrumentation suite.
          - layout: tiny
            resolution: 480x800
            density: 320
            artifact: sudoku-emulator-tiny-splash-home
          - layout: medium
            resolution: 800x1440
            density: 320
            artifact: sudoku-emulator-medium-splash-home
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Enable KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Run Android UI flow and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
          script: |
            # Seven layout profiles, five full suites and two focused boundary tests:
            # 270dp narrow, 640x360dp landscape, 800dp tablet, 240dp tiny and 400dp medium.
            # Only reference screenshots are compared to the owner's 941x1672 art.
            adb shell wm size ${{ matrix.resolution }}
            # Keep density stable to reveal layout overflow and touch targets.
            adb shell wm density ${{ matrix.density }}
            adb shell wm size
            adb shell wm density
            bash .github/scripts/run-visual-smoke.sh $(if [ "${{ matrix.layout }}" = "tiny" ] || [ "${{ matrix.layout }}" = "medium" ]; then echo --splash-home-only; fi)
      - name: Upload instrumentation failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-test-failure-${{ matrix.layout }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
      - name: Upload actual Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: screenshots/*.png
          if-no-files-found: warn
