name: Android visual smoke

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/visual-smoke.yml"
  workflow_dispatch:

concurrency:
  group: emulator-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Android UI (${{ matrix.layout }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: reference
            resolution: 941x1672
            density: 320
            artifact: sudoku-emulator-screen-references
          - layout: compact
            resolution: 720x1280
            density: 320
            artifact: sudoku-emulator-compact-screenshots
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Run Android UI flow and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
          script: |
            # Exact source reference baseline plus a narrow-screen UI regression.
            # Never compare compact screenshots directly against 941x1672 art.
            adb shell wm size ${{ matrix.resolution }}
            # Keep density stable to reveal layout overflow and touch targets.
            adb shell wm density ${{ matrix.density }}
            adb shell wm size
            adb shell wm density
            bash .github/scripts/run-visual-smoke.sh
      - name: Upload actual Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: screenshots/*.png
          if-no-files-found: warn
