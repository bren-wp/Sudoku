name: Verify Sudoku release classification

# Independently reconcile unsigned releases even after later metadata edits.
# Github-token-authored edits do not reliably emit additional release events.
on:
  workflow_run:
    workflows: ["Publish Sudoku release"]
    types: [completed]
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-classification.yml"
      - "scripts/reconcile-release-classification.sh"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sudoku-release-classification
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile all published unsigned-AAB releases
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/reconcile-release-classification.sh "$REPO"
